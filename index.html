<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Private Share</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eef5ff;
            color: #17223b;
            font: 16px system-ui, -apple-system, "Segoe UI", sans-serif
        }

        .card {
            width: min(100%, 540px);
            padding: 32px;
            background: #fff;
            border: 1px solid #dce8f8;
            border-radius: 18px;
            box-shadow: 0 12px 35px #a8c4e344
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px
        }

        .intro,
        .status {
            color: #5d6b82;
            line-height: 1.5
        }

        .field {
            display: flex;
            gap: 10px;
            margin-top: 24px
        }

        input {
            min-width: 0;
            flex: 1;
            border: 1px solid #cdd9e8;
            border-radius: 10px;
            padding: 12px;
            font: inherit
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            background: #1769e0;
            color: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer
        }

        button:hover {
            background: #0e59c3
        }

        button.secondary {
            background: #e7eef8;
            color: #284260
        }

        button.danger {
            background: #d53d4d
        }

        .output {
            display: none;
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid #e5edf6
        }

        .linkbox {
            display: flex;
            gap: 8px;
            margin: 8px 0 16px
        }

        .linkbox input {
            background: #f7faff
        }

        .error {
            color: #bd2534;
            margin-top: 14px
        }

        .call-actions {
            display: none;
            gap: 10px;
            margin-top: 14px
        }

        .call-actions button {
            flex: 1
        }

        @media(max-width:480px) {
            .card {
                padding: 24px
            }

            .field,
            .linkbox {
                flex-direction: column
            }

            .field button {
                width: 100%
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Private Share</h1>
        <p class="intro">Create a private link to share content and request a voice connection.</p>
        <div class="field"><input id="originalUrl" type="url" placeholder="Paste Original Link"
                autocomplete="url"><button id="generate">Generate Special Link</button></div>
        <p id="error" class="error" role="alert"></p>
        <section id="output" class="output"><strong>Your Special Link</strong>
            <div class="linkbox"><input id="specialLink" readonly><button id="copy" class="secondary">Copy</button>
            </div>
            <p id="status" class="status">Waiting for friend...</p>
            <div id="incoming" class="call-actions"><button id="accept">Accept</button><button id="reject"
                    class="danger">Reject</button></div>
            <div id="connected" class="call-actions"><button id="mute" class="secondary">Mute</button><button id="end"
                    class="danger">End Call</button></div><audio id="remoteAudio" autoplay></audio>
        </section>
    </main>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        // Replace this single value with your Render service URL (without a trailing slash).
        const BACKEND_URL = "https://YOUR-RENDER-APP.onrender.com";
        let socket, shareId, peerConnection, muted = false;
        const $ = id => document.getElementById(id);
        const status = text => $("status").textContent = text;
        const setError = text => $("error").textContent = text;
        const show = (id, visible) => $(id).style.display = visible ? "flex" : "none";

        async function safeJson(response) { const text = await response.text(); try { return { data: JSON.parse(text) }; } catch { return { error: text.trim().startsWith("<") ? "Backend returned HTML instead of JSON. Check your Render URL." : "Backend returned an invalid response." }; } }
        function connectCreator() {
            socket = io(BACKEND_URL, { transports: ["websocket", "polling"] });
            socket.on("connect", () => socket.emit("creator-register", { shareId }));
            socket.on("connect_error", () => setError("Could not connect to the backend. Check your Render URL."));
            socket.on("friend-connected", () => status("Friend opened the link."));
            socket.on("receiver-ready", () => { status("Incoming Voice Connection — Your friend has allowed microphone access."); show("incoming", true); });
            socket.on("call-rejected", () => { status("Voice connection rejected."); show("incoming", false); });
            socket.on("webrtc-offer", async ({ offer }) => { try { peerConnection = createPeerConnection(); await peerConnection.setRemoteDescription(offer); const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer); socket.emit("webrtc-answer", { shareId, answer }); status("Connecting..."); } catch { setError("WebRTC connection failed."); endCall(false); } });
            socket.on("webrtc-ice-candidate", async ({ candidate }) => { try { if (peerConnection && candidate) await peerConnection.addIceCandidate(candidate); } catch { setError("WebRTC connection failed."); } });
            socket.on("webrtc-answer", async ({ answer }) => { try { await peerConnection?.setRemoteDescription(answer); } catch { setError("WebRTC connection failed."); } });
            socket.on("call-started", () => { if (!peerConnection) status("Connecting..."); });
            socket.on("call-ended", ({ reason } = {}) => { closePeer(); show("incoming", false); show("connected", false); status(reason || "Call ended."); });
        }
        function createPeerConnection() { const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }); pc.onicecandidate = e => { if (e.candidate) socket.emit("webrtc-ice-candidate", { shareId, candidate: e.candidate }); }; pc.ontrack = e => { $("remoteAudio").srcObject = e.streams[0]; status("🟢 Voice Connected"); show("incoming", false); show("connected", true); }; pc.onconnectionstatechange = () => { if (pc.connectionState === "failed") { setError("WebRTC connection failed."); endCall(); } }; return pc; }
        function closePeer() { if (peerConnection) { peerConnection.close(); peerConnection = null; } $("remoteAudio").srcObject = null; }
        function endCall(notify = true) { closePeer(); show("incoming", false); show("connected", false); status("Call ended."); if (notify && socket) socket.emit("call-ended", { shareId }); }
        $("generate").onclick = async () => { setError(""); const originalUrl = $("originalUrl").value.trim(); try { new URL(originalUrl); } catch { setError("Please enter a valid URL."); return; } $("generate").disabled = true; try { const response = await fetch(BACKEND_URL + "/api/shares", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ originalUrl }) }); const result = await safeJson(response); if (result.error) throw new Error(result.error); if (!response.ok || !result.data.id) throw new Error(result.data.error || "Could not create the share."); shareId = result.data.id; $("specialLink").value = BACKEND_URL.replace(/\/$/, "") + "/s/" + shareId; $("output").style.display = "block"; status("Waiting for friend..."); connectCreator(); } catch (error) { setError(error.message === "Failed to fetch" ? "Backend is offline or unreachable. Check your Render URL." : error.message); } finally { $("generate").disabled = false; } };
        $("copy").onclick = async () => { try { await navigator.clipboard.writeText($("specialLink").value); $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1200); } catch { $("specialLink").select(); document.execCommand("copy"); } };
        $("accept").onclick = () => { show("incoming", false); status("Connecting..."); socket.emit("call-accepted", { shareId }); };
        $("reject").onclick = () => { show("incoming", false); status("Voice connection rejected."); socket.emit("call-rejected", { shareId }); };
        $("mute").onclick = () => { muted = !muted; $("remoteAudio").muted = muted; $("mute").textContent = muted ? "Unmute" : "Mute"; };
        $("end").onclick = () => endCall();
    </script>
</body>

</html>
