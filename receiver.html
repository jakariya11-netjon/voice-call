<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Share</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7fd;color:#17223b;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.page{width:min(100%,1000px);margin:auto;padding:22px}.content{min-height:55vh;background:#fff;border:1px solid #dce8f8;border-radius:16px;overflow:hidden;display:grid;place-items:center}.content iframe,.content img,.content video{display:block;width:100%;max-height:72vh;border:0;object-fit:contain}.content iframe{height:72vh}.fallback{padding:40px;text-align:center;color:#5d6b82}.status{margin:14px 4px 0;color:#5d6b82}.error{color:#bd2534}</style></head>
<body><main class="page"><section id="content" class="content"><p>Loading shared content…</p></section><p id="status" class="status">Requesting microphone permission…</p></main><script src="/socket.io/socket.io.js"></script><script>
const shareId = location.pathname.split("/").pop(); let socket, peerConnection, stream, joined = false, microphoneGranted = false;
const $ = id => document.getElementById(id); const status = (text, error=false) => { $("status").textContent=text; $("status").className="status"+(error?" error":""); };
function embed(url) { const box=$("content"); let parsed; try { parsed=new URL(url); } catch { box.innerHTML='<p class="fallback">This content cannot be displayed.</p>'; return; } const host=parsed.hostname.replace(/^www\./,""); const path=parsed.pathname.toLowerCase(); let youtubeId; if(host==="youtu.be") youtubeId=parsed.pathname.slice(1).split("/")[0]; if(host.endsWith("youtube.com")) youtubeId=parsed.searchParams.get("v") || (path.startsWith("/embed/")?parsed.pathname.split("/")[2]:null); if(youtubeId) { box.innerHTML=""; const f=document.createElement("iframe"); f.src="https://www.youtube.com/embed/"+encodeURIComponent(youtubeId); f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"; f.allowFullscreen=true; box.append(f); return; } if(/\.(jpe?g|png|gif|webp|svg)(?:$|[?#])/.test(path+parsed.search)) { box.innerHTML=""; const i=new Image(); i.src=url;i.alt="Shared image";i.onerror=()=>box.innerHTML='<p class="fallback">This image could not be loaded.</p>';box.append(i);return; } if(/\.(mp4|webm|ogg|mov)(?:$|[?#])/.test(path+parsed.search)) { box.innerHTML="";const v=document.createElement("video");v.src=url;v.controls=true;v.playsInline=true;v.onerror=()=>box.innerHTML='<p class="fallback">This video could not be loaded.</p>';box.append(v);return; } box.innerHTML="";const f=document.createElement("iframe");f.src=url;f.title="Shared content";f.referrerPolicy="strict-origin-when-cross-origin";f.onload=()=>setTimeout(()=>status("If this website blocks embedding, its content may remain unavailable here."),1000);box.append(f); }
async function loadShare() { try { const response=await fetch("/api/shares/"+encodeURIComponent(shareId)); if(!response.ok) throw new Error(); const data=await response.json(); embed(data.originalUrl); } catch { $("content").innerHTML='<p class="fallback">This private share is invalid or has expired.</p>'; status("Unable to load shared content.",true); } }
function createPeer() { const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); pc.onicecandidate=e=>{if(e.candidate)socket.emit("webrtc-ice-candidate",{shareId,candidate:e.candidate});}; pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected")status("Voice connected.");if(pc.connectionState==="failed")status("WebRTC connection failed.",true);}; stream.getTracks().forEach(track=>pc.addTrack(track,stream));return pc; }
function announceReady(){if(joined&&microphoneGranted)socket.emit("receiver-ready",{shareId});}
async function begin() { socket=io();socket.on("connect",()=>{socket.emit("receiver-join",{shareId});joined=true;announceReady();});socket.on("connect_error",()=>status("Could not connect to the backend.",true));socket.on("call-accepted",async()=>{try{peerConnection=createPeer();const offer=await peerConnection.createOffer();await peerConnection.setLocalDescription(offer);socket.emit("webrtc-offer",{shareId,offer});status("Connecting…");}catch{status("WebRTC connection failed.",true);}});socket.on("call-rejected",()=>status("Voice connection rejected."));socket.on("webrtc-answer",async({answer})=>{try{await peerConnection.setRemoteDescription(answer);}catch{status("WebRTC connection failed.",true);}});socket.on("webrtc-ice-candidate",async({candidate})=>{try{if(candidate)await peerConnection?.addIceCandidate(candidate);}catch{status("WebRTC connection failed.",true);}});socket.on("call-ended",()=>{peerConnection?.close();status("Call ended.");}); try { stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); microphoneGranted=true; status("Microphone allowed. Waiting for the creator to accept."); announceReady(); } catch { status("Microphone permission was not granted.",true); } }
loadShare();begin();
</script></body></html>
